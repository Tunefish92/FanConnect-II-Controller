[package]
name = "gpu-fanctl"
version = "0.1.0"
edition = "2024"
description = "FanConnect II Controller: temperature-controlled case fans on the FanConnect II headers of the ASUS ROG Strix RTX 2080 Ti"
authors = ["Tunefish"]
license = "MIT"
repository = "https://github.com/Tunefish92/FanConnect-II-Controller"

[dependencies]
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
eframe = { version = "0.36.2", optional = true }
egui_plot = { version = "0.37.0", optional = true }
humantime = "2.4.0"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
libloading = "0.9.0"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:image"]

[[bin]]
name = "gpu-fanctl"
path = "src/main.rs"

[[bin]]
name = "gpu-fanctl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[build-dependencies]
winresource = "0.1.31"
